<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagina non trovata | Lusso Roma</title>
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; display: grid; min-height: 100svh; place-items: center; padding: 24px; background: #121719; color: #fff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(680px, 100%); }
    p { color: #cfd5d2; font-size: 18px; line-height: 1.65; }
    .code { margin: 0 0 14px; color: #d7b36a; font-size: 13px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 58px; font-weight: 500; line-height: 1.08; }
    a { display: inline-block; margin-top: 18px; padding-bottom: 5px; border-bottom: 2px solid #d7b36a; color: #fff; font-weight: 750; text-decoration: none; }
    @media (max-width: 620px) { h1 { font-size: 44px; } }
  </style>
</head>
<body>
  <main>
    <p class="code">Errore 404</p>
    <h1>Questa strada non porta dove pensavi.</h1>
    <p>La pagina non esiste oppure è stata spostata. Torna al taccuino principale e riparti da Roma.</p>
    <a href="https://lussoroma.github.io/">Torna a Lusso Roma</a>
  </main>
</body>
</html>
